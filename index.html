    tudo.list.forEach(function(s){
      treinos.push([fmtDate(s.d), origName(s), s.race ? raceShort(s) : '', Number(s.km.toFixed(3)), fmtTime(s.time), fmtTime(s.elapsed), fmtPace(s.pace),
        s.effort != null ? s.effort : '', s.cadence || '', s.prs.map(function(k){ return DIST_BY[k].label; }).join(', ')]);
    });
    var esf = [['Ambiente', 'Distância', 'Posição', 'Tempo', 'Ritmo por km', 'Data', 'Origem']];
    ['esteira', 'rua', 'tudo'].forEach(function(env){
      var a = analyze(state.sessions, env);
      DISTS.forEach(function(D){
        (a.tables[D.k] || []).slice(0, 5).forEach(function(e, i){
          esf.push([env === 'tudo' ? 'Tudo' : env === 'rua' ? 'Rua' : 'Esteira', D.label, i + 1, fmtTime(e.t), fmtPace(e.t / (D.m / 1000)), fmtDate(e.s.d), origName(e.s)]);
        });
      });
    });
    var metas = [['Distância', 'Base', 'Data da base', 'Meta de', 'Meta até', 'Melhor em prova', 'Melhor em treino na rua']];
    GOAL_KEYS.forEach(function(k){
      var g = GOALS[k];
      if (!g || g.baseT == null) return;
      var tb = rua.tables[k] || [];
      var bp = tb.filter(function(e){ return e.s.race; })[0], bt = tb.filter(function(e){ return !e.s.race; })[0];
      metas.push([DIST_BY[k].label, fmtTime(g.baseT), g.baseDate ? fmtDate(parseIso(g.baseDate)) : '', g.lo != null ? fmtTime(g.lo) : '', g.hi != null ? fmtTime(g.hi) : '',
        bp ? fmtTime(bp.t) : '', bt ? fmtTime(bt.t) : '']);
    });
    var provas = [['Data', 'Prova', 'Número de peito', 'Distância oficial', 'Tempo na distância', 'Ritmo por km', 'Km no relógio', 'Tempo total no relógio', 'Objetivo', 'Meta', 'Splits por km']];
    all.filter(function(s){ return s.race; }).forEach(function(s){
      var info = infoFor(s.d) || {};
      var ctx = raceContext(s, info, rua.tables);
      var resT = ctx && ctx.result ? ctx.result.t : s.elapsed;
      var dk = info.km || s.km;
      var doc = effortDocs[s.id];
      provas.push([fmtDate(s.d), info.name || s.name, info.bib || '', dk, fmtTime(resT), fmtPace(resT / dk), Number(s.km.toFixed(3)), fmtTime(s.elapsed),
        ctx && ctx.before ? fmtTime(ctx.before.t) : '', ctx && ctx.meta ? ctx.meta.txt + ' (' + (ctx.meta.kind === 'hit' ? 'batida' : ctx.meta.kind === 'base' ? 'base' : 'não batida') + ')' : '',
        doc && doc.splits ? doc.splits.map(function(x){ return fmtTime(x.t); }).join(' | ') : '']);
    });
    var wb = X.utils.book_new();
    [['Treinos', treinos], ['Melhores esforços', esf], ['Metas', metas], ['Provas', provas]].forEach(function(p){
      var ws = X.utils.aoa_to_sheet(p[1]);
      ws['!cols'] = p[1][0].map(function(){ return { wch: 18 }; });
      X.utils.book_append_sheet(wb, ws, p[0]);
    });
    return X.write(wb, { bookType: 'xlsx', type: 'array' });
  }
  $('#export').addEventListener('click', async function(){
    if (!state.sessions) return;
    var btn = $('#export');
    btn.disabled = true;
    try {
      var X = await loadXLSX();
      var buf = buildWorkbook(X);
      var dd = new Date();
      saveFile(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), 'recordes-' + isoOf(dd) + '.xlsx');
    } catch (e) {
      $('#status').textContent = 'Não consegui montar a planilha agora.';
    }
    btn.disabled = false;
  });
  document.addEventListener('toggle', function(ev){
    var d = ev.target;
    if (!d || !d.getAttribute) return;
    var k = d.getAttribute('data-sec');
    if (!k) return;
    if (!!openSec[k] === d.open) return;
    openSec[k] = d.open;
    try { localStorage.setItem('recordes-open', JSON.stringify(openSec)); } catch(e) {}
  }, true);

  function redrawRaces(focusSel){
    $('#races').innerHTML = racesSection();
    if (focusSel) { var el = $(focusSel); if (el) el.focus(); }
  }
  function parseDur(v){
    var s = String(v).trim().toLowerCase().replace(/\s+/g, '');
    var m = /^(\d+)(?:min|m)(?:(\d{1,2})s?)?$/.exec(s);
    if (m) return (+m[1]) * 60 + (+(m[2] || 0));
    m = /^(\d+)h(\d{1,2})(?:min|m)?(?:(\d{1,2})s?)?$/.exec(s);
    if (m) return (+m[1]) * 3600 + (+m[2]) * 60 + (+(m[3] || 0));
    var n = parseFloat(s.replace(',', '.'));
    return isFinite(n) ? Math.round(n * 60) : NaN;
  }
  $('#races').addEventListener('change', function(ev){
    if (!ev.target || ev.target.id !== 'goal-sel') return;
    var nk = ev.target.value;
    if (nk !== goalK && !editingGoal) {
      goalK = nk; GOAL = getGoal(nk);
      try { localStorage.setItem(lsKey('recordes-meta-k'), nk); } catch(e) {}
      redrawRaces('#goal-sel');
    }
  });
  $('#races').addEventListener('click', function(ev){
    var gk = ev.target.closest && ev.target.closest('[data-gk]');
    if (gk) {
      var nk = gk.getAttribute('data-gk');
      if (nk !== goalK && !editingGoal) {
        goalK = nk; GOAL = getGoal(nk);
        try { localStorage.setItem(lsKey('recordes-meta-k'), nk); } catch(e) {}
        redrawRaces('[data-gk="' + nk + '"]');
      }
      return;
    }
    var b = ev.target.closest && ev.target.closest('[data-act]');
    if (!b) return;
    var act = b.getAttribute('data-act');
    if (act === 'edit') {
      editingGoal = true; goalErr = '';
      redrawRaces('#goal-lo');
    } else if (act === 'cancel') {
      editingGoal = false; goalErr = '';
      redrawRaces('[data-act="edit"]');
    } else if (act === 'save') {
      var lo = parseDur($('#goal-lo').value), hi = parseDur($('#goal-hi').value);
      var g = { lo: lo, hi: hi };
      if (!validGoal(g)) {
        goalErr = 'Escreva os tempos como 48min ou 47min30s, com o primeiro menor ou igual ao segundo.';
        var keepLo = $('#goal-lo').value, keepHi = $('#goal-hi').value;
        redrawRaces();
        $('#goal-lo').value = keepLo; $('#goal-hi').value = keepHi;
        $('#goal-lo').focus();
        return;
      }
      GOAL.lo = lo; GOAL.hi = hi;
      GOAL.setDate = isoOf(new Date());
      GOAL.rule = GOAL_RULE;
      editingGoal = false; goalErr = '';
      persistGoals();
      redrawRaces('[data-act="edit"]');
    }
  });

  /* ---------- race editor ---------- */

  var raceEdit = null;
  function raceField(n){ return $('#race-form').elements.namedItem(n); }
  function openRaceDlg(date, pastId){
    var r = date ? RACE_INFO.filter(function(x){ return x.date === date; })[0] : null;
    var s = pastId && state.sessions ? state.sessions.filter(function(x){ return x.id === pastId; })[0] : null;
    raceEdit = { orig: r ? r.date : null, past: !!pastId };
    raceField('name').value = r ? r.name : (s ? s.name : '');
    raceField('date').value = r ? r.date : (date || '');
    raceField('date').readOnly = !!pastId;
    raceField('km').value = r ? String(r.km).replace('.', ',') : '';
    raceField('local').value = r && r.local !== 'A confirmar' ? r.local : '';
    raceField('bib').value = r ? r.bib || '' : '';
    raceField('note').value = r ? r.note || '' : '';
    $('#race-dlg-title').textContent = r ? 'Editar prova' : 'Nova prova';
    $('#race-del').hidden = !r;
    $('#race-err').hidden = true;
    var dlg = $('#race-dlg');
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
  }
  function closeRaceDlg(){
    var dlg = $('#race-dlg');
    if (dlg.close) dlg.close(); else dlg.removeAttribute('open');
  }
  function raceErr(t){ var e = $('#race-err'); e.textContent = t; e.hidden = false; }
  $('#race-form').addEventListener('submit', function(ev){
    ev.preventDefault();
    var name = raceField('name').value.trim();
    var date = raceField('date').value;
    var km = parseFloat(String(raceField('km').value).replace(',', '.'));
    if (!name) return raceErr('Coloque o nome da prova.');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return raceErr('Escolha a data.');
    if (!(km > 0 && km <= 300)) return raceErr('Coloque a distância em km, como 5 ou 21,1.');
    var clash = RACE_INFO.filter(function(x){ return x.date === date && x.date !== (raceEdit && raceEdit.orig); })[0];
    if (clash) return raceErr('Já existe uma prova nesse dia.');
    var old = raceEdit && raceEdit.orig ? RACE_INFO.filter(function(x){ return x.date === raceEdit.orig; })[0] : null;
    var item = { date: date, name: name, short: old && old.name === name ? old.short : name, km: Math.round(km * 1000) / 1000,
      local: raceField('local').value.trim() || 'A confirmar', bib: raceField('bib').value.trim(), note: raceField('note').value.trim() };
    var list = RACE_INFO.filter(function(x){ return !old || x !== old; }).concat([item]);
    setRaces(list);
    saveRaces();
    bumpData();
    closeRaceDlg();
    render();
  });
  $('#race-cancel').addEventListener('click', closeRaceDlg);
  $('#race-del').addEventListener('click', function(){
    if (!raceEdit || !raceEdit.orig) return;
    if (!window.confirm('Excluir esta prova?')) return;
    setRaces(RACE_INFO.filter(function(x){ return x.date !== raceEdit.orig; }));
    saveRaces();
    bumpData();
    closeRaceDlg();
    render();
  });
  $('#panel').addEventListener('click', function(ev){
    var t = ev.target;
    var add = t.closest && t.closest('[data-race-add]');
    if (add) { openRaceDlg(null, null); return; }
    var ed = t.closest && t.closest('[data-race-edit]');
    if (ed) openRaceDlg(ed.getAttribute('data-race-edit'), ed.getAttribute('data-race-past'));
  });

  /* ---------- start ---------- */

  function setRaces(list){
    RACE_INFO.length = 0;
    (Array.isArray(list) ? list : []).forEach(function(r){
      if (!r || !/^\d{4}-\d{2}-\d{2}$/.test(r.date || '') || !(Number(r.km) > 0)) return;
      RACE_INFO.push({ date: r.date, bib: r.bib ? String(r.bib) : '', short: r.short || r.name || 'Prova', name: r.name || r.short || 'Prova',
        km: Number(r.km), local: r.local || '', note: r.note || '' });
    });
    RACE_INFO.sort(function(a, b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
  }
  function saveRaces(){
    putDoc('config', 'races', { races: RACE_INFO.map(function(r){ return Object.assign({}, r); }) });
    flushDocs();
  }

  var docsReady = null;
  function startDb(){
    docsReady = apiFetch('/docs').then(function(j){
      db = true;
      (j && j.docs || []).forEach(function(d){
        var v = d.data || {};
        if (d.col === 'efforts') effortDocs[d.id] = v;
        else if (d.col === 'config' && d.id === 'metas') loadGoals(v.goals);
        else if (d.col === 'config' && d.id === 'races') setRaces(v.races);
        else if (d.col === 'config' && d.id === 'settings') { RANGE_START = v.range_start || ''; WALK_UNTIL = v.walk_until || ''; }
      });
      GOAL = getGoal(goalK);
    }).catch(function(){ db = null; }).then(function(){
      dbLoaded = true;
      goalLoaded = true;
      bumpData();
      if (session) { render(); kick(); }
    });
    return docsReady;
  }

  async function start(){
    var params = new URLSearchParams(location.search);
    if (params.has('code') || params.has('error')) await finishOAuth(params);
    if (!session) { state.status = 'login'; render(); return; }
    mcp = mcpShim;
    state.status = 'loading';
    render();
    startDb();
    apiFetch('/me').then(function(j){
      if (j && j.athlete) { me = j.athlete; try { localStorage.setItem('rc-me', JSON.stringify(me)); } catch(e) {} }
    }).catch(function(){});
    loadActivities();
  }

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }

  start();
})();
</script>
</body>
</html>
